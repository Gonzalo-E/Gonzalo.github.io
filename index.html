<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      max-width: 800px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    h1 {
      color: var(--accent);
      font-size: 2.2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card);
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .card h3 {
      margin-bottom: .5rem;
    }

    .card a {
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      opacity: .7;
    }
  </style>
</head>

<body>
  <header>
    <h1>Gonzalo Esqueche</h1>
    <p>Web Developer / Cybersecurity Engineer</p>
  </header>
  <main class="grid">
    <div class="card">
      <h3>Pokemmo Overlay</h3>
      <p>Is a overlay for pokemmo that shows information of the game in real time.</p>
      <a href="https://github.com/Gonzalo-E/Re-run-Overlay-pokemmo" target="_blank">Code &rarr;</a>
    </div>
  </main>
  <footer>
    <p>Contact: <a href="mailto:Email" style="color:var(--accent);">gesquechegeldres@gmail.com</a>
    </p>
  </footer>
</body>

</html>
